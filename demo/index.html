/* Gắn theme TRƯỚC khi trang vẽ lần đầu — nếu để app.js làm thì màn hình
   sẽ loé một nhịp nền tối rồi mới nhảy sang nền sáng. */
(function () {
  var t = null;
  try { t = localStorage.getItem("rg-theme"); } catch (e) {}
  /* chưa chọn gì thì luôn mở ở giao diện sáng, không bám theo hệ điều hành */

  document.documentElement.setAttribute("data-theme", t);
})();
