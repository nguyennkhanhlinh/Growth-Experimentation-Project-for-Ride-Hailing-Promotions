[project]
name = "ride-hailing-promotions-growth"
version = "0.1.0"
description = "Growth & Experimentation project for ride-hailing promotions"
readme = "README.md"
requires-python = "==3.14.*"

dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "pyarrow==25.0.0",
    "PyYAML==6.0.3",
    "matplotlib==3.11.1",
    "joblib==1.5.3",
    # đọc feature_catalog.xlsx và xuất bảng markdown trong báo cáo tự sinh
    "openpyxl==3.1.5",
    "tabulate==0.10.0",
    # chạy notebook — nbclient là backend của run_pipeline.py
    "ipykernel==7.3.0",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
]

[tool.uv]

package = false
