<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="description" content="Máy tính chiến dịch khuyến mãi: chọn nhóm khách hàng và sáu tham số kinh doanh, hệ thống tính lại chi phí, chuyến tăng thêm, ROI, ngưỡng hoà vốn và khuyến nghị.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M26 68V46m16 22V32m16 36V52m16 16V38' stroke='%23fff' stroke-width='9' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
/* Gắn theme TRƯỚC khi trang vẽ lần đầu — nếu để app.js làm thì màn hình
   sẽ loé một nhịp nền tối rồi mới nhảy sang nền sáng. */
(function () {
  var t = null;
  try { t = localStorage.getItem("rg-theme"); } catch (e) {}
  /* chưa chọn gì thì luôn mở ở giao diện sáng, không bám theo hệ điều hành */
  if (t !== "light" && t !== "dark") t = "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body data-palette="#8b5cf6,#ec4899,#0891b2">

<div class="shell">

  <!-- ============ SIDEBAR ============ -->

      </button>
    </div>

    <nav class="nav" aria-label="Điều hướng chính">
      <a class="nav-item" href="#overview" data-section="overview">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="10" width="7" height="11" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg></span>
        <span>Tổng quan</span>
      </a>

    <div class="sidebar-foot">
      <div class="foot-card">
        <p class="foot-title">Dữ liệu nguồn</p>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Mở menu">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-head">
        <h1 class="topbar-title" id="pageTitle">Tổng quan</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-btn" id="themeBtn" type="button"
                aria-label="Chuyển chế độ sáng / tối" aria-pressed="false" title="Chuyển sang chế độ sáng">
          <svg class="ico-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z" stroke-linejoin="round"/>
          </svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.4v2.2M12 19.4v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke-linecap="round"/>
